<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 가족 이야기책</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#8A5A3B;
    --navy-deep:#5C3A24;
    --gold:#F0AC4E;
    --coral:#E8734A;
    --paper:#FFF9EC;
    --paper-shade:#F5E6C8;
    --ink:#4A3527;
    --green:#8AA06B;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; min-height:100%;
    background:
      radial-gradient(ellipse at 15% 8%, #FBE4BE 0%, transparent 55%),
      radial-gradient(ellipse at 90% 90%, #F6D2A0 0%, transparent 55%),
      linear-gradient(160deg, #FEF6E8 0%, #F7E6C9 100%);
    font-family:'Gowun Batang', serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  .stars{ position:fixed; inset:0; pointer-events:none; z-index:0; }
  .stars span{
    position:absolute; width:4px; height:4px; border-radius:50%;
    background:var(--gold); opacity:.4;
    animation:twinkle 3.8s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.15; } 50%{ opacity:.6; } }

  .app{
    position:relative; z-index:1; min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 16px 40px;
  }

  .intro{ text-align:center; max-width:480px; margin:0 0 22px; font-size:15px; line-height:1.6; color:#8A6B4F; }
  .intro strong{
    display:block; font-family:'Gaegu', sans-serif; font-weight:700; font-size:30px;
    color:var(--coral); margin-bottom:8px; letter-spacing:.3px;
  }

  /* ---------- shelf ---------- */
  .shelf{ width:100%; max-width:440px; display:flex; flex-direction:column; gap:10px; }
  .new-book-btn{
    background:var(--coral); color:#fff; font-family:'Gaegu',sans-serif; font-weight:700;
    border:2px solid var(--navy-deep); border-radius:14px 12px 14px 12px; padding:15px; font-size:17px; cursor:pointer;
    box-shadow:0 4px 0 #B5502C;
  }
  .new-book-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #B5502C; }
  .shelf-list{ display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .book-card{
    background:var(--paper); color:var(--ink); border:2px solid #E9D6AE; border-radius:12px 10px 12px 10px;
    padding:13px 16px; text-align:left; cursor:pointer; font-family:'Gowun Batang',serif;
    display:flex; flex-direction:column; gap:2px;
  }
  .book-card .b-title{ font-family:'Gaegu',sans-serif; font-weight:700; font-size:16.5px; color:var(--navy-deep); }
  .book-card .b-meta{ font-size:12px; color:#A38A5F; }
  .shelf-status{ text-align:center; font-size:13px; color:#A8875C; padding:16px 0; }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(74,53,39,.55);
    display:flex; align-items:center; justify-content:center; z-index:60; padding:20px;
  }
  .modal-box{ background:var(--paper); color:var(--ink); border-radius:16px 12px 16px 12px; border:2px solid #E9D6AE; padding:22px; width:100%; max-width:300px; text-align:center; }
  .modal-box h3{ font-family:'Gaegu',sans-serif; font-weight:700; font-size:19px; margin:0 0 6px; }
  .modal-box p{ font-size:12.5px; color:#A38A5F; margin:0 0 14px; line-height:1.5; }
  .modal-box input{
    width:100%; padding:10px 12px; border-radius:8px; border:2px solid #E7DBBE;
    font-family:'Gowun Batang',serif; font-size:15px; margin-bottom:14px; box-sizing:border-box;
  }
  .modal-actions{ display:flex; gap:8px; }
  .modal-actions button{ flex:1; padding:10px; border-radius:8px; border:none; font-family:'Gaegu',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; }
  .modal-cancel{ background:#E9D6AE; color:var(--ink); }
  .modal-confirm{ background:var(--green); color:#fff; }

  /* ---------- book screen ---------- */
  .book-screen{ display:flex; flex-direction:column; align-items:center; width:100%; }
  .back-btn{
    align-self:flex-start; margin:0 0 14px; background:#FFF3DC; border:1.5px solid #E0C48E;
    color:var(--navy-deep); font-family:'Gaegu',sans-serif; font-weight:700; font-size:14px; padding:7px 14px;
    border-radius:999px; cursor:pointer;
  }

  .stage{ perspective:2400px; width:clamp(260px, 82vw, 400px); aspect-ratio: 3 / 4.15; position:relative; }
  .book-shadow{
    position:absolute; left:8%; right:8%; bottom:-18px; height:26px;
    background:radial-gradient(ellipse at center, rgba(90,60,30,.35), transparent 70%); filter:blur(4px);
  }
  .book{ position:relative; width:100%; height:100%; transform-style:preserve-3d; }
  .book-edges{
    position:absolute; inset:0; border-radius:8px 16px 16px 8px;
    box-shadow:3px 3px 0 var(--paper-shade), 6px 6px 0 rgba(232,211,163,.8), 9px 9px 14px rgba(90,58,30,.3);
    background:var(--paper);
    filter:url(#roughen);
  }
  .page{ position:absolute; inset:0; transform-origin:left center; transform-style:preserve-3d; transition:transform .85s cubic-bezier(.45,.1,.15,1); }
  .page.flipped{ transform:rotateY(-178deg); }
  .page-face{
    position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden;
    border-radius:8px 16px 16px 8px; background:var(--paper); display:flex; flex-direction:column; overflow:hidden;
  }
  .page-face::after{
    content:''; position:absolute; inset:0 auto 0 0; width:18px;
    background:linear-gradient(to right, rgba(90,58,30,.14), transparent); pointer-events:none;
  }
  .page-face.back{ transform:rotateY(180deg); background:var(--paper-shade); }
  .page-face.back::before{
    content:''; position:absolute; inset:0; opacity:.5;
    background:repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(74,53,39,.06) 28px);
  }
  .page-number{ position:absolute; bottom:12px; right:16px; font-family:'Gaegu', sans-serif; font-weight:700; font-size:14px; color:#B49A6E; }

  .cover{
    background:radial-gradient(circle at 75% 18%, rgba(240,172,78,.45), transparent 40%), linear-gradient(150deg, var(--coral) 0%, var(--navy-deep) 100%);
    color:var(--paper); justify-content:center; align-items:center; text-align:center; padding:32px 22px; gap:14px;
  }
  .cover h1{ font-family:'Gaegu', sans-serif; font-weight:700; font-size:clamp(23px,6vw,32px); margin:0; line-height:1.3; outline:none; max-width:100%; }
  .cover .author{ font-family:'Gowun Batang', serif; font-size:15px; color:#FBE4C4; outline:none; min-width:60px; }
  .cover .author.is-empty::before{ content:attr(data-placeholder); color:#E8C79A; }
  .cover h1.is-empty::before{ content:attr(data-placeholder); color:#F5D9A8; }
  .open-btn{
    margin-top:10px; font-family:'Gaegu', sans-serif; font-weight:700; font-size:16px; background:var(--gold); color:var(--navy-deep);
    border:none; padding:11px 26px; border-radius:999px; cursor:pointer; box-shadow:0 4px 0 #C4842E;
  }
  .open-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #C4842E; }

  .content-page{ padding:16px 16px 36px; }
  .draw-slot{ width:100%; min-height:110px; flex-shrink:0; border-radius:12px; overflow:hidden; border:2.5px solid #E3C99A; background:#FDF6E7; display:flex; flex-direction:column; }
  .toolbar-toggle{
    width:100%; text-align:center; background:#EFDCB0; border:none; border-bottom:1.5px solid #E3C99A;
    font-family:'Gaegu',sans-serif; font-weight:700; font-size:12px; color:#8A6B4F;
    padding:3px 0; cursor:pointer;
  }
  .draw-toolbar{ display:flex; flex-direction:column; gap:5px; padding:6px 8px; background:#F5E6C8; border-bottom:1.5px solid #E3C99A; }
  .draw-toolbar.collapsed{ display:none; }
  .toolbar-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .toolbar-row2{ padding-top:4px; border-top:1px dashed #DFC591; }
  .slider-label{ font-family:'Gaegu',sans-serif; font-weight:700; font-size:12px; color:#8A6B4F; flex-shrink:0; }
  .slot-slider{ width:70px; accent-color:var(--coral); flex-shrink:0; }
  .remove-slot-btn{
    margin-left:auto; background:#FBDDD3; color:#B5502C; border:1.5px solid #E8A990;
    font-family:'Gaegu',sans-serif; font-weight:700; font-size:12.5px;
    padding:4px 10px; border-radius:999px; cursor:pointer; flex-shrink:0;
  }
  .add-draw-btn{
    align-self:flex-start; margin-bottom:12px; background:#FFF3DC; border:2px dashed #E0C48E;
    color:var(--navy-deep); font-family:'Gaegu',sans-serif; font-weight:700; font-size:13px;
    padding:7px 14px; border-radius:10px; cursor:pointer;
  }
  .swatch{ width:19px; height:19px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; flex-shrink:0; }
  .swatch.active{ border-color:var(--navy-deep); }
  .tool-sep{ width:1px; height:18px; background:#D6BD8C; margin:0 2px; flex-shrink:0; }
  .size-btn{ width:24px; height:24px; border-radius:50%; border:2px solid transparent; background:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .size-btn.active{ border-color:var(--navy-deep); }
  .size-btn span{ display:block; border-radius:50%; background:var(--ink); }
  .icon-btn{ width:24px; height:24px; border-radius:6px; border:none; background:none; cursor:pointer; font-size:13px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .icon-btn.active{ background:#E7CC96; }
  .draw-canvas{ flex:1; width:100%; height:100%; touch-action:none; cursor:crosshair; display:block; }

  .story-text{ flex:1; margin-top:14px; font-family:'Gowun Batang', serif; font-size:15px; line-height:1.75; color:var(--ink); outline:none; overflow-y:auto; }
  .story-text.is-empty::before{ content:attr(data-placeholder); color:#C2AC85; }

  .control-bar{ display:flex; align-items:center; gap:10px; margin-top:22px; flex-wrap:wrap; justify-content:center; }
  .nav-btn, .action-btn{ font-family:'Gaegu', sans-serif; font-weight:700; border:none; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .nav-btn{ width:42px; height:42px; border-radius:50%; background:var(--navy); color:#FFF3DC; font-size:19px; }
  .nav-btn:disabled{ opacity:.3; cursor:default; }
  .indicator{ min-width:64px; text-align:center; background:var(--gold); color:var(--navy-deep); font-size:14.5px; padding:8px 14px; border-radius:999px; }
  .action-btn{ font-size:14px; color:#fff; padding:9px 16px; border-radius:999px; }
  .add-btn{ background:var(--green); }
  .del-btn{ background:#C15C5C; }
  .export-btn{ background:#5D8B85; }
  .action-btn:disabled{ opacity:.35; cursor:default; }

  .save-status{ margin-top:16px; font-size:12.5px; color:#8AA06B; text-align:center; }
  .hint{ margin-top:6px; font-size:12.5px; color:#A8875C; text-align:center; max-width:320px; line-height:1.6; }
  .hidden{ display:none !important; }
  @media (max-width:420px){ .intro strong{ font-size:24px; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
  </filter>
</svg>

<div class="stars" id="stars"></div>

<div class="app">
  <div class="intro">
    <strong>나만의 이야기 만들기</strong>
    이름을 적고 나만의 책을 만들어보세요. 그림과 글은 자동으로 저장돼요.
  </div>

  <!-- shelf screen -->
  <div class="shelf" id="shelfScreen">
    <button class="new-book-btn" id="newBookBtn">+ 새 책 시작하기</button>
    <div class="shelf-list" id="shelfList"></div>
    <div class="shelf-status" id="shelfStatus">불러오는 중...</div>
  </div>

  <!-- book screen -->
  <div class="book-screen hidden" id="bookScreen">
    <button class="back-btn" id="backBtn">← 책장으로</button>
    <div class="stage" id="stage">
      <div class="book-shadow"></div>
      <div class="book" id="book">
        <div class="book-edges"></div>
      </div>
    </div>
    <div class="control-bar">
      <button class="nav-btn" id="prevBtn" aria-label="이전 페이지">‹</button>
      <div class="indicator" id="indicator">표지</div>
      <button class="nav-btn" id="nextBtn" aria-label="다음 페이지">›</button>
    </div>
    <div class="control-bar">
      <button class="action-btn add-btn" id="addBtn">+ 새 페이지</button>
      <button class="action-btn del-btn" id="delBtn">이 페이지 지우기</button>
    </div>
    <div class="control-bar">
      <button class="action-btn export-btn" id="exportBtn">이 책 파일로 저장</button>
    </div>
    <div class="save-status" id="saveStatus"></div>
    <div class="hint">화면의 왼쪽·오른쪽을 눌러도 책장이 넘어가요.</div>
  </div>

  <!-- new book modal -->
  <div class="modal-overlay hidden" id="nameModal">
    <div class="modal-box">
      <h3>이름이 뭐예요?</h3>
      <p>같은 이름으로 다시 들어오면 쓰던 책을 이어서 쓸 수 있어요.</p>
      <input type="text" id="nameInput" placeholder="예: 민준" maxlength="20">
      <input type="text" id="titleInput" placeholder="책 제목 (예: 민준이의 모험)" maxlength="24">
      <div class="modal-actions">
        <button class="modal-cancel" id="nameCancel">취소</button>
        <button class="modal-confirm" id="nameConfirm">시작하기</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var starsEl = document.getElementById('stars');
  for(var i=0;i<26;i++){
    var s = document.createElement('span');
    s.style.left = (Math.random()*100)+'%';
    s.style.top = (Math.random()*70)+'%';
    s.style.animationDelay = (Math.random()*3.4)+'s';
    starsEl.appendChild(s);
  }

  // 파이어베이스 주소는 더 이상 여기 직접 넣지 않아요.
  // Vercel의 Settings → Environment Variables 에 FIREBASE_DB_URL 을 등록하면,
  // /api/config.js 를 통해 접속할 때 자동으로 안전하게 불러와요.
  var FIREBASE_DB_URL = '';
  var hasFirebase = false;

  function sanitizeName(name){
    // 파이어베이스 키에 쓸 수 없는 문자(. # $ [ ] /)를 제거
    var clean = (name || '').trim().replace(/[.#$\[\]\/\\'"]/g, '').replace(/\s+/g, '_');
    return clean.slice(0, 40);
  }

  async function bookGet(name){
    if(hasFirebase){
      try{
        var url = FIREBASE_DB_URL.replace(/\/$/,'') + '/books/' + encodeURIComponent(name) + '.json';
        var res = await fetch(url);
        if(!res.ok) return null;
        return await res.json();
      }catch(e){ return null; }
    }
    try{
      var raw = localStorage.getItem('book:' + name);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  async function bookSet(name, data){
    if(hasFirebase){
      try{
        var url = FIREBASE_DB_URL.replace(/\/$/,'') + '/books/' + encodeURIComponent(name) + '.json';
        var res = await fetch(url, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
        return res.ok;
      }catch(e){ return false; }
    }
    try{ localStorage.setItem('book:' + name, JSON.stringify(data)); return true; }
    catch(e){ return false; }
  }
  async function bookListAll(){
    if(hasFirebase){
      try{
        var url = FIREBASE_DB_URL.replace(/\/$/,'') + '/books.json';
        var res = await fetch(url);
        if(!res.ok) return {};
        var data = await res.json();
        return data || {};
      }catch(e){ return {}; }
    }
    try{
      var out = {};
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf('book:') === 0){
          var raw = localStorage.getItem(k);
          if(raw){ try{ out[k.slice(5)] = JSON.parse(raw); }catch(e){} }
        }
      }
      return out;
    }catch(e){ return {}; }
  }
  function relTime(ts){
    if(!ts) return '';
    var diff = Date.now() - ts;
    var m = Math.floor(diff/60000);
    if(m < 1) return '방금 전';
    if(m < 60) return m+'분 전';
    var h = Math.floor(m/60);
    if(h < 24) return h+'시간 전';
    var d = Math.floor(h/24);
    return d+'일 전';
  }
  function escapeHtml(str){
    var d = document.createElement('div');
    d.innerText = str || '';
    return d.innerHTML;
  }

  var COLORS = ['#4A3527','#E8734A','#F0AC4E','#8AA06B','#5D8B85','#B25FE3'];
  var SIZES = [3, 7, 13];
  var tool = { color: COLORS[0], size: SIZES[1], eraser:false };
  var toolbarCollapsed = false;

  var pages = null;
  var current = 0;
  var currentName = null;

  var shelfScreen = document.getElementById('shelfScreen');
  var bookScreen = document.getElementById('bookScreen');
  var shelfList = document.getElementById('shelfList');
  var shelfStatus = document.getElementById('shelfStatus');
  var newBookBtn = document.getElementById('newBookBtn');
  var nameModal = document.getElementById('nameModal');
  var nameInput = document.getElementById('nameInput');
  var titleInput = document.getElementById('titleInput');
  var nameCancel = document.getElementById('nameCancel');
  var nameConfirm = document.getElementById('nameConfirm');
  var backBtn = document.getElementById('backBtn');

  var bookEl = document.getElementById('book');
  var stageEl = document.getElementById('stage');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var addBtn = document.getElementById('addBtn');
  var delBtn = document.getElementById('delBtn');
  var exportBtn = document.getElementById('exportBtn');
  var indicator = document.getElementById('indicator');
  var saveStatus = document.getElementById('saveStatus');

  // ---------- shelf ----------
  async function loadShelf(){
    shelfStatus.textContent = '불러오는 중...';
    shelfList.innerHTML = '';
    if(!hasFirebase){
      shelfStatus.textContent = '⚠ 아직 공유 저장소가 연결되지 않았어요. 지금은 이 기기에만 저장돼요.';
    }
    var all = await bookListAll();
    var names = Object.keys(all || {});
    if(!names.length){
      shelfStatus.textContent = hasFirebase ? '아직 만든 책이 없어요. 첫 책을 시작해보세요!' : shelfStatus.textContent;
      return;
    }
    var items = names.map(function(name){
      var data = all[name] || {};
      var cover = (data.pages && data.pages[0]) || {};
      return { name: name, title: cover.title || '나의 이야기책', author: cover.author || name, updatedAt: data.updatedAt || 0 };
    });
    items.sort(function(a,b){ return b.updatedAt - a.updatedAt; });
    if(hasFirebase) shelfStatus.textContent = '';
    items.forEach(function(it){
      var card = document.createElement('button');
      card.className = 'book-card';
      card.innerHTML =
        '<span class="b-title">'+ escapeHtml(it.title) +'</span>' +
        '<span class="b-meta">'+ escapeHtml(it.author || '이름 없음') + ' · ' + relTime(it.updatedAt) +'</span>';
      card.addEventListener('click', function(){ openBook(it.name); });
      shelfList.appendChild(card);
    });
  }

  newBookBtn.addEventListener('click', function(){
    nameInput.value = '';
    titleInput.value = '';
    nameModal.classList.remove('hidden');
    setTimeout(function(){ nameInput.focus(); }, 50);
  });
  nameCancel.addEventListener('click', function(){ nameModal.classList.add('hidden'); });
  nameModal.addEventListener('click', function(e){ if(e.target === nameModal) nameModal.classList.add('hidden'); });
  nameInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') titleInput.focus(); });
  titleInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') nameConfirm.click(); });

  nameConfirm.addEventListener('click', async function(){
    var rawName = nameInput.value.trim();
    if(!rawName){ nameInput.focus(); return; }
    var rawTitle = titleInput.value.trim() || '나의 이야기책';
    nameModal.classList.add('hidden');
    var name = sanitizeName(rawName);
    var data = await bookGet(name);
    if(data && data.pages){
      pages = data.pages;
    } else {
      pages = [
        { type:'cover', title:rawTitle, author:rawName },
        { type:'content', text:'', drawing:null }
      ];
    }
    currentName = name;
    current = 0;
    await saveCurrentBook();
    openBookScreen();
  });

  async function openBook(name){
    var data = await bookGet(name);
    if(!data || !data.pages) return;
    pages = data.pages;
    currentName = name;
    current = 0;
    openBookScreen();
  }

  function openBookScreen(){
    shelfScreen.classList.add('hidden');
    bookScreen.classList.remove('hidden');
    setStatus('자동으로 저장돼요');
    build();
  }

  backBtn.addEventListener('click', function(){
    bookScreen.classList.add('hidden');
    shelfScreen.classList.remove('hidden');
    currentName = null;
    pages = null;
    loadShelf();
  });

  // ---------- saving current book ----------
  var saveTimer = null;
  function setStatus(text){ saveStatus.textContent = text; }
  function scheduleSave(){
    clearTimeout(saveTimer);
    setStatus('저장 중...');
    saveTimer = setTimeout(saveCurrentBook, 700);
  }
  async function saveCurrentBook(){
    if(!currentName) return;
    var ok = await bookSet(currentName, { pages: pages, updatedAt: Date.now() });
    setStatus(ok ? '저장됐어요' : '저장하지 못했어요');
  }

  // ---------- drawing ----------
  function initCanvas(p, canvas){
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.max(1, w * dpr);
    canvas.height = Math.max(1, h * dpr);
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    canvas._ctx = ctx;
    canvas._w = w; canvas._h = h;

    if(p.drawing){
      var img = new Image();
      img.onload = function(){
        // 늘려서 채우지 않고, 비율을 유지한 채 새 크기에 맞춰 다시 그려요 (잘림/찌그러짐 방지)
        var scale = Math.min(w / img.width, h / img.height);
        var dw = img.width * scale, dh = img.height * scale;
        var dx = (w - dw) / 2, dy = (h - dh) / 2;
        ctx.drawImage(img, dx, dy, dw, dh);
      };
      img.src = p.drawing;
    }

    var drawingNow = false;
    var last = null;
    function getPos(e){
      var r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    function strokeSetup(){
      ctx.globalCompositeOperation = tool.eraser ? 'destination-out' : 'source-over';
      ctx.strokeStyle = tool.color;
      ctx.lineWidth = tool.size;
    }
    canvas.addEventListener('pointerdown', function(e){
      e.preventDefault();
      drawingNow = true;
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      last = getPos(e);
      strokeSetup();
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(last.x + 0.01, last.y + 0.01);
      ctx.stroke();
    });
    canvas.addEventListener('pointermove', function(e){
      if(!drawingNow) return;
      var pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      last = pos;
    });
    function endStroke(){
      if(!drawingNow) return;
      drawingNow = false;
      p.drawing = canvas.toDataURL('image/png');
      scheduleSave();
    }
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointerleave', endStroke);
    canvas.addEventListener('pointercancel', endStroke);
  }

  function updateToolbarActive(toolbarEl){
    toolbarEl.querySelectorAll('.swatch').forEach(function(btn){
      btn.classList.toggle('active', !tool.eraser && btn.dataset.color === tool.color);
    });
    toolbarEl.querySelectorAll('.size-btn').forEach(function(btn){
      btn.classList.toggle('active', parseInt(btn.dataset.size,10) === tool.size);
    });
    var eraserBtn = toolbarEl.querySelector('.eraser-btn');
    if(eraserBtn) eraserBtn.classList.toggle('active', tool.eraser);
  }

  function buildToolbar(p, canvas, drawSlot){
    var bar = document.createElement('div');
    bar.className = 'draw-toolbar';

    var row1 = document.createElement('div');
    row1.className = 'toolbar-row';
    var row2 = document.createElement('div');
    row2.className = 'toolbar-row toolbar-row2';

    COLORS.forEach(function(c){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'swatch'; b.style.background = c; b.dataset.color = c;
      b.setAttribute('aria-label', '색 선택');
      b.addEventListener('click', function(){ tool.color = c; tool.eraser = false; updateToolbarActive(bar); });
      row1.appendChild(b);
    });
    var sep1 = document.createElement('div'); sep1.className = 'tool-sep'; row1.appendChild(sep1);
    SIZES.forEach(function(sz){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'size-btn'; b.dataset.size = sz;
      var dot = document.createElement('span');
      var d = 4 + sz * 0.9;
      dot.style.width = d+'px'; dot.style.height = d+'px';
      b.appendChild(dot);
      b.addEventListener('click', function(){ tool.size = sz; updateToolbarActive(bar); });
      row1.appendChild(b);
    });
    var sep2 = document.createElement('div'); sep2.className = 'tool-sep'; row1.appendChild(sep2);

    var photoBtn = document.createElement('button');
    photoBtn.type = 'button'; photoBtn.className = 'icon-btn'; photoBtn.title = '사진 넣기'; photoBtn.innerHTML = '🖼';
    var photoInput = document.createElement('input');
    photoInput.type = 'file'; photoInput.accept = 'image/*'; photoInput.style.display = 'none';
    photoBtn.addEventListener('click', function(){ photoInput.click(); });
    photoInput.addEventListener('change', function(){
      var file = photoInput.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          var ctx = canvas._ctx;
          var pad = 0.92; // 살짝 여백을 둬서 가장자리에 딱 붙지 않게
          var boxW = canvas._w * pad, boxH = canvas._h * pad;
          var scale = Math.min(boxW / img.width, boxH / img.height);
          var w = img.width * scale, h = img.height * scale;
          var x = (canvas._w - w) / 2, y = (canvas._h - h) / 2;
          ctx.clearRect(0, 0, canvas._w, canvas._h);
          ctx.drawImage(img, x, y, w, h);
          p.drawing = canvas.toDataURL('image/png');
          scheduleSave();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      photoInput.value = '';
    });
    row1.appendChild(photoBtn);
    row1.appendChild(photoInput);

    var sep3 = document.createElement('div'); sep3.className = 'tool-sep'; row1.appendChild(sep3);
    var eraserBtn = document.createElement('button');
    eraserBtn.type = 'button'; eraserBtn.className = 'icon-btn eraser-btn'; eraserBtn.title = '지우개'; eraserBtn.innerHTML = '⌫';
    eraserBtn.addEventListener('click', function(){ tool.eraser = true; updateToolbarActive(bar); });
    row1.appendChild(eraserBtn);
    var clearBtn = document.createElement('button');
    clearBtn.type = 'button'; clearBtn.className = 'icon-btn'; clearBtn.title = '전체 지우기'; clearBtn.innerHTML = '🗑';
    clearBtn.addEventListener('click', function(){
      var ctx = canvas._ctx;
      ctx.clearRect(0, 0, canvas._w, canvas._h);
      p.drawing = null;
      scheduleSave();
    });
    row1.appendChild(clearBtn);

    var sliderLabel = document.createElement('span');
    sliderLabel.className = 'slider-label';
    sliderLabel.textContent = '그림칸 크기';
    row2.appendChild(sliderLabel);

    var sizeSlider = document.createElement('input');
    sizeSlider.type = 'range'; sizeSlider.min = '22'; sizeSlider.max = '72';
    sizeSlider.value = p.slotHeight || 46;
    sizeSlider.className = 'slot-slider';
    sizeSlider.title = '그림칸 크기 조절';
    sizeSlider.addEventListener('input', function(){
      drawSlot.style.height = sizeSlider.value + '%';
    });
    sizeSlider.addEventListener('change', function(){
      p.slotHeight = parseInt(sizeSlider.value, 10);
      initCanvas(p, canvas);
      scheduleSave();
    });
    row2.appendChild(sizeSlider);

    var removeSlotBtn = document.createElement('button');
    removeSlotBtn.type = 'button';
    removeSlotBtn.className = 'remove-slot-btn';
    removeSlotBtn.textContent = '✖ 그림칸 삭제';
    removeSlotBtn.addEventListener('click', function(e){
      e.stopPropagation();
      p.hasDrawing = false;
      build();
      scheduleSave();
    });
    row2.appendChild(removeSlotBtn);

    bar.appendChild(row1);
    bar.appendChild(row2);

    updateToolbarActive(bar);
    return bar;
  }

  function makePageEl(p, index){
    var page = document.createElement('div');
    page.className = 'page';
    page.dataset.index = index;
    var front = document.createElement('div');
    front.className = 'page-face front';
    var pendingCanvasInit = null;

    if(p.type === 'cover'){
      front.classList.add('cover');
      front.innerHTML =
        '<h1 contenteditable="true" data-placeholder="책 제목을 적어주세요">'+ escapeHtml(p.title) +'</h1>' +
        '<div class="author" contenteditable="true" data-placeholder="지은이 이름을 적어주세요">'+ escapeHtml(p.author) +'</div>' +
        '<button class="open-btn" type="button">책 펼치기</button>';
    } else {
      front.classList.add('content-page');

      if(p.hasDrawing === false){
        var addDrawBtn = document.createElement('button');
        addDrawBtn.type = 'button';
        addDrawBtn.className = 'add-draw-btn';
        addDrawBtn.textContent = '+ 그림칸 추가';
        addDrawBtn.addEventListener('click', function(){
          p.hasDrawing = true;
          build();
          scheduleSave();
        });
        front.appendChild(addDrawBtn);
      } else {
        var drawSlot = document.createElement('div');
        drawSlot.className = 'draw-slot';
        drawSlot.style.height = (p.slotHeight || 46) + '%';
        var canvas = document.createElement('canvas');
        canvas.className = 'draw-canvas';
        var toolbar = buildToolbar(p, canvas, drawSlot);
        if(toolbarCollapsed) toolbar.classList.add('collapsed');

        var toggleBar = document.createElement('button');
        toggleBar.type = 'button';
        toggleBar.className = 'toolbar-toggle';
        toggleBar.textContent = toolbarCollapsed ? '🎨 도구 펼치기 ▾' : '🎨 도구 접기 ▴';
        toggleBar.addEventListener('click', function(e){
          e.stopPropagation();
          toolbarCollapsed = !toolbarCollapsed;
          toolbar.classList.toggle('collapsed', toolbarCollapsed);
          toggleBar.textContent = toolbarCollapsed ? '🎨 도구 펼치기 ▾' : '🎨 도구 접기 ▴';
          initCanvas(p, canvas);
        });

        drawSlot.appendChild(toggleBar);
        drawSlot.appendChild(toolbar);
        drawSlot.appendChild(canvas);
        front.appendChild(drawSlot);
        pendingCanvasInit = function(){ initCanvas(p, canvas); };
      }

      var story = document.createElement('div');
      story.className = 'story-text';
      story.contentEditable = 'true';
      story.setAttribute('data-placeholder', '여기에 이야기를 적어보세요...');
      story.innerText = p.text || '';
      if(!p.text) story.classList.add('is-empty');
      story.addEventListener('input', function(){
        p.text = story.innerText;
        story.classList.toggle('is-empty', story.innerText.trim() === '');
        scheduleSave();
        applyCoverMood();
      });
      story.addEventListener('paste', function(e){
        e.preventDefault();
        var text = (e.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, text);
      });

      front.appendChild(story);
    }

    var back = document.createElement('div');
    back.className = 'page-face back';
    if(p.type !== 'cover') back.innerHTML = '<span class="page-number">'+ index +'</span>';

    page.appendChild(front);
    page.appendChild(back);
    page._initCanvas = pendingCanvasInit;
    return page;
  }

  function build(){
    var olds = bookEl.querySelectorAll('.page');
    olds.forEach(function(el){ el.remove(); });
    pages.forEach(function(p, i){
      var el = makePageEl(p, i);
      if(i < current) el.classList.add('flipped');
      el.style.zIndex = (i < current) ? i : (pages.length - i) + pages.length;
      bookEl.appendChild(el);
      if(el._initCanvas) el._initCanvas();

      var openBtn = el.querySelector('.open-btn');
      if(openBtn) openBtn.addEventListener('click', function(e){ e.stopPropagation(); goNext(); });

      var titleEl = el.querySelector('h1');
      if(titleEl){
        titleEl.classList.toggle('is-empty', titleEl.innerText.trim()==='');
        titleEl.addEventListener('input', function(){
          p.title = titleEl.innerText;
          titleEl.classList.toggle('is-empty', titleEl.innerText.trim()==='');
          scheduleSave();
          applyCoverMood();
        });
      }
      var authorEl = el.querySelector('.author');
      if(authorEl){
        authorEl.classList.toggle('is-empty', authorEl.innerText.trim()==='');
        authorEl.addEventListener('input', function(){
          p.author = authorEl.innerText;
          authorEl.classList.toggle('is-empty', authorEl.innerText.trim()==='');
          scheduleSave();
        });
      }
    });
    updateUI();
    applyCoverMood();
  }

  // ---------- story-based cover mood ----------
  var MOODS = [
    { id:'ocean',   words:['바다','물고기','파도','배','인어','상어','돌고래','바닷속','조개','섬'],
      grad:'linear-gradient(150deg, #4E86C6 0%, #1F3A5C 100%)', glow:'rgba(120,190,255,.45)' },
    { id:'space',   words:['우주','별','로켓','행성','달','외계인','은하수','유성','우주선'],
      grad:'linear-gradient(150deg, #6C5CE7 0%, #221B4A 100%)', glow:'rgba(190,170,255,.45)' },
    { id:'forest',  words:['숲','나무','동물','다람쥐','토끼','곰','사슴','풀','꽃밭','새'],
      grad:'linear-gradient(150deg, #6FA96A 0%, #2E4B2A 100%)', glow:'rgba(190,235,160,.45)' },
    { id:'fantasy', words:['공주','마법','성','요정','왕자','드래곤','마법사','유니콘','왕국'],
      grad:'linear-gradient(150deg, #D66FB0 0%, #4A2A5C 100%)', glow:'rgba(255,195,235,.45)' },
    { id:'winter',  words:['눈','겨울','산타','눈사람','크리스마스','루돌프','썰매'],
      grad:'linear-gradient(150deg, #6FB6C9 0%, #24404D 100%)', glow:'rgba(205,242,255,.5)' }
  ];
  function detectMood(){
    if(!pages) return null;
    var text = pages.filter(function(p){ return p.type === 'content'; })
      .map(function(p){ return p.text || ''; }).join(' ') + ' ' + ((pages[0] && pages[0].title) || '');
    var best = null, bestCount = 0;
    MOODS.forEach(function(m){
      var count = 0;
      m.words.forEach(function(w){ if(text.indexOf(w) !== -1) count++; });
      if(count > bestCount){ bestCount = count; best = m; }
    });
    return best;
  }
  function applyCoverMood(){
    var coverEl = bookEl.querySelector('.cover');
    if(!coverEl) return;
    var mood = detectMood();
    if(mood){
      coverEl.style.background = 'radial-gradient(circle at 75% 18%, '+mood.glow+', transparent 40%), ' + mood.grad;
    } else {
      coverEl.style.background = '';
    }
  }

  function updateFlipStates(){
    var els = bookEl.querySelectorAll('.page');
    els.forEach(function(el){
      var i = parseInt(el.dataset.index, 10);
      el.classList.toggle('flipped', i < current);
      el.style.zIndex = (i < current) ? i : (pages.length - i) + pages.length;
    });
    updateUI();
  }

  function updateUI(){
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === pages.length - 1;
    indicator.textContent = (pages[current].type === 'cover') ? '표지' : (current + ' / ' + (pages.length - 1));
    delBtn.disabled = pages[current].type === 'cover';
    delArmed = false;
    clearTimeout(delArmTimer);
    delBtn.textContent = '이 페이지 지우기';
  }

  function goNext(){ if(current < pages.length - 1){ current++; updateFlipStates(); } }
  function goPrev(){ if(current > 0){ current--; updateFlipStates(); } }
  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);

  addBtn.addEventListener('click', function(){
    pages.splice(current + 1, 0, { type:'content', text:'', drawing:null });
    current = current + 1;
    build();
    scheduleSave();
  });

  var delArmed = false;
  var delArmTimer = null;
  delBtn.addEventListener('click', function(){
    if(pages[current].type === 'cover') return;
    var contentCount = pages.filter(function(p){ return p.type==='content'; }).length;
    if(contentCount <= 1){
      delBtn.textContent = '최소 한 장은 있어야 해요';
      clearTimeout(delArmTimer);
      delArmTimer = setTimeout(function(){ delBtn.textContent = '이 페이지 지우기'; }, 1800);
      return;
    }
    if(!delArmed){
      delArmed = true;
      delBtn.textContent = '한 번 더 누르면 삭제돼요';
      clearTimeout(delArmTimer);
      delArmTimer = setTimeout(function(){ delArmed = false; delBtn.textContent = '이 페이지 지우기'; }, 3000);
      return;
    }
    clearTimeout(delArmTimer);
    delArmed = false;
    delBtn.textContent = '이 페이지 지우기';
    pages.splice(current, 1);
    if(current > pages.length - 1) current = pages.length - 1;
    build();
    scheduleSave();
  });

  exportBtn.addEventListener('click', function(){
    try{
      var seed = JSON.stringify(pages);
      var titleText = (pages[0] && pages[0].title) ? pages[0].title.trim() : '나의 이야기책';
      var safeName = titleText.replace(/[\\/:*?"<>|]/g, '').trim() || '나의 이야기책';
      var snapshot =
'<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>'+escapeHtml(titleText)+'</title>' +
'<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
'<style>body{font-family:sans-serif;background:#131B2E;color:#FFF7E8;text-align:center;padding:40px 20px;}' +
'a{color:#FFC857;}</style></head><body>' +
'<h2>'+escapeHtml(titleText)+'</h2><p>이 파일은 백업용 스냅샷이에요. 원래 책장 사이트로 돌아가 이어서 쓰세요.</p>' +
'<pre style="text-align:left;white-space:pre-wrap;background:#22304C;padding:16px;border-radius:10px;max-width:520px;margin:20px auto;font-size:12px;overflow:auto;">'+escapeHtml(seed)+'</pre>' +
'</body></html>';
      var blob = new Blob([snapshot], { type:'text/html' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = safeName + '-백업.html';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      setStatus('백업 파일을 저장했어요');
    }catch(err){ setStatus('내보내기에 실패했어요'); }
  });

  stageEl.addEventListener('click', function(e){
    if(e.target.closest('button, [contenteditable], input, label, canvas, .draw-toolbar')) return;
    var rect = stageEl.getBoundingClientRect();
    var x = e.clientX - rect.left;
    if(x < rect.width / 2) goPrev(); else goNext();
  });

  window.addEventListener('keydown', function(e){
    var active = document.activeElement;
    if(active && active.isContentEditable) return;
    if(e.key === 'ArrowRight') goNext();
    if(e.key === 'ArrowLeft') goPrev();
  });

  async function loadFirebaseConfig(){
    try{
      var res = await fetch('/api/config');
      if(res.ok){
        var data = await res.json();
        if(data && data.firebaseDbUrl){
          FIREBASE_DB_URL = data.firebaseDbUrl;
          hasFirebase = true;
        }
      }
    }catch(e){
      // /api/config 를 못 불러오면(예: 로컬에서 그냥 파일로 열었을 때) 이 기기 저장으로만 동작해요.
    }
    loadShelf();
  }

  loadFirebaseConfig();
})();
</script>
